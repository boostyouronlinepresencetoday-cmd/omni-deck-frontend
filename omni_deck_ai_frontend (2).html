<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNI-DECK.AI — Instant Pitch Deck Feedback</title>
<style>
body {font-family:Inter,Arial,sans-serif;background:#fff;color:#111;margin:0;display:flex;flex-direction:column;align-items:center;}
header{text-align:center;margin-top:60px;}
h1{font-size:2.5rem;font-weight:700;margin-bottom:0.3rem;}
p.subtitle{color:#555;font-size:1.1rem;}
#drop-zone{margin-top:40px;border:2px dashed #007bff;border-radius:14px;width:80%;max-width:600px;padding:60px;text-align:center;cursor:pointer;transition:background 0.3s;}
#drop-zone.hover{background:#eef5ff;}
#upload-status{margin-top:15px;font-size:1rem;color:#555;}
#result{margin-top:40px;max-width:700px;width:90%;display:none;}
.card{background:#f9f9f9;border-radius:12px;padding:20px;box-shadow:0 0 10px rgba(0,0,0,0.05);}
h2{font-size:1.5rem;margin-bottom:10px;}
ul{padding-left:20px;}
.cta{margin-top:40px;text-align:center;}
.cta a{background:#007bff;color:#fff;padding:14px 26px;border-radius:8px;text-decoration:none;font-weight:600;}
.cta a:hover{background:#0056cc;}
footer{margin:60px 0 20px;color:#999;font-size:0.9rem;}
</style>
</head>
<body>
<header>
  <h1>OMNI-DECK.AI</h1>
  <p class="subtitle">Upload your pitch deck to get instant AI feedback powered by Deck Analyzer ASI.</p>
</header>

<div id="drop-zone">
  <p><strong>Drag & Drop</strong> your deck here or click to upload</p>
  <input type="file" id="file-input" accept=".pdf,.ppt,.pptx" style="display:none;">
  <div id="upload-status"></div>
</div>

<div id="result" class="card"></div>

<div class="cta">
  <p>Want a full investor-grade review and deck upgrade?</p>
  <a href="https://linkedin.com/in/jacobwthompson1" target="_blank">
    Connect with Jacob Thompson on LinkedIn
  </a>
</div>

<footer>© 2025 OMNI-DECK.AI — Helping founders go investor-ready</footer>

<script>
const API_URL = "https://omni-deck-ai.onrender.com/analyze";
const dropZone=document.getElementById("drop-zone");
const fileInput=document.getElementById("file-input");
const uploadStatus=document.getElementById("upload-status");
const resultDiv=document.getElementById("result");

dropZone.addEventListener("click",()=>fileInput.click());
dropZone.addEventListener("dragover",e=>{e.preventDefault();dropZone.classList.add("hover");});
dropZone.addEventListener("dragleave",()=>dropZone.classList.remove("hover"));
dropZone.addEventListener("drop",e=>{e.preventDefault();dropZone.classList.remove("hover");handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener("change",e=>handleFile(e.target.files[0]));

function handleFile(file){
  if(!file)return;
  uploadStatus.textContent="Analyzing deck...";
  const formData=new FormData();
  formData.append("file",file);
  fetch(API_URL,{method:"POST",body:formData})
    .then(r=>r.json())
    .then(d=>{
      uploadStatus.textContent="";
      if(d.error){uploadStatus.textContent=d.error;return;}
      showResult(d);
    })
    .catch(()=>uploadStatus.textContent="Error analyzing file.");
}

function showResult(d){
  resultDiv.style.display="block";
  resultDiv.innerHTML=`
    <h2>AI Summary</h2>
    <p>${d.summary || "No summary provided."}</p>
    ${makeSection("Strengths", d.strengths)}
    ${makeSection("Weak Points", d.weaknesses)}
    ${makeSection("Investor Risk Map", d.investor_risks)}
    ${makeSection("Optimization Steps", d.optimization_steps)}
    <p><strong>Funding Readiness:</strong> ${d.funding_readiness || "Pending analysis"}</p>
    <h3>vΩ Summary</h3>
    <p>${d.vomega_summary || "Awaiting equilibrium synthesis."}</p>
  `;
  resultDiv.scrollIntoView({behavior:"smooth"});
}

function makeSection(title, items){
  if(!items || items.length===0)return""; 
  return `<h3>${title}</h3><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
}
</script>
</body>
</html>
